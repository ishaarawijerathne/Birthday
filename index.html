<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Melisa!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e6d9ff, #d4c1f7, #efe3ff, #c9b6f2);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
    font-family: "Segoe UI", Tahoma, sans-serif;
    overflow: hidden;
    text-align: center;
  }
  @keyframes bg {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 24px;
    padding: 40px 28px;
    max-width: 520px;
    width: 90%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    animation: pop 1s ease both;
  }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .cake { font-size: 72px; animation: bounce 1.6s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }
  h1 {
    font-size: clamp(2rem, 7vw, 3rem);
    margin: 10px 0;
    background: linear-gradient(90deg, #9d6bff, #b388ff, #7e57c2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .name { font-size: clamp(2.4rem, 9vw, 3.6rem); font-weight: 800; color: #8e5fd8; margin-bottom: 16px; }
  p { color: #444; font-size: 1.1rem; line-height: 1.6; margin-bottom: 22px; }
  button {
    border: none;
    padding: 14px 28px;
    font-size: 1.05rem;
    border-radius: 999px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(90deg, #a77bff, #8e5fd8);
    box-shadow: 0 8px 20px rgba(142, 95, 216, 0.4);
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.07); }
  .balloon {
    position: fixed;
    bottom: -120px;
    font-size: 54px;
    z-index: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-120vh) rotate(15deg); }
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="card">
  <div class="cake">🎂</div>
  <h1>Happy Birthday!</h1>
  <div class="name">Dewmi 🎉</div>
  <p>
    Wishing you a day filled with love, laughter, and all the things that make you smile.
    May this new year of your life bring you endless joy, success, and beautiful memories.
    You deserve the very best today and always! 💖
  </p>
  <button id="btn">Celebrate 🎈</button>
</div>

<script>
  // Floating balloons
  const emojis = ["🎈", "🎈", "🎁", "🎉", "✨", "💖"];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement("div");
    b.className = "balloon";
    b.textContent = emojis[i % emojis.length];
    b.style.left = Math.random() * 100 + "vw";
    b.style.animationDuration = 8 + Math.random() * 8 + "s";
    b.style.animationDelay = Math.random() * 8 + "s";
    document.body.appendChild(b);
  }

  // Confetti
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let pieces = [];
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  addEventListener("resize", resize);

  function burst() {
    const colors = ["#b388ff", "#9d6bff", "#d1b3ff", "#7e57c2", "#e6d9ff", "#f3a6ff"];
    for (let i = 0; i < 150; i++) {
      pieces.push({
        x: innerWidth / 2,
        y: innerHeight / 2,
        vx: (Math.random() - 0.5) * 16,
        vy: Math.random() * -14 - 2,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        life: 180
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.rot += 6;
      p.life--;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size / 2);
      ctx.restore();
    });
    pieces = pieces.filter(p => p.life > 0 && p.y < canvas.height + 20);
    requestAnimationFrame(draw);
  }
  draw();

  document.getElementById("btn").addEventListener("click", burst);
  setTimeout(burst, 600);
</script>
</body>
</html>
